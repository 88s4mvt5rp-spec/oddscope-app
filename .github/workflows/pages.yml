# Publie l'appli sur GitHub Pages et recalcule les statistiques chaque lundi.
# À activer une seule fois : Settings > Pages > Source : « GitHub Actions ».
name: Publier l'appli
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Statistiques et validation (football-data.co.uk)
        if: github.event_name != 'push'
        run: python tools/export_mobile.py --backtest --out app/data/models.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
